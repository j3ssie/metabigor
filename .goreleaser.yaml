# GoReleaser configuration for metabigor
# See https://goreleaser.com for documentation

version: 2

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: metabigor
    main: ./cmd/metabigor
    binary: metabigor
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # v-prefixed to match internal/core/constants.go, so `metabigor version`
      # reads the same whether the binary came from make, npm, or a release.
      - -X main.version=v{{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
    hooks:
      post:
        # UPX compress binaries after build (requires upx installed)
        # Use --best for maximum compression, --lzma for best ratio
        # Skip macOS arm64 as UPX doesn't support it well
        - cmd: sh -c 'if command -v upx >/dev/null 2>&1; then if [ "{{ .Os }}" = "darwin" ] && [ "{{ .Arch }}" = "arm64" ]; then echo "Skipping UPX for macOS ARM64"; else upx --best --lzma "{{ .Path }}" || echo "UPX failed, continuing"; fi; else echo "UPX not installed, skipping"; fi'

archives:
  - id: metabigor
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CLAUDE.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  # Snapshot builds normally take their version from the newest git tag, which
  # drifts behind internal/core/constants.go between releases. The npm packaging
  # flow (`make npm-build`) exports METABIGOR_VERSION from constants.go so the
  # binaries — and the archive names build/npm/build.mjs verifies them by —
  # carry the exact version being published.
  version_template: "{{ if .Env.METABIGOR_VERSION }}{{ .Env.METABIGOR_VERSION }}{{ else }}{{ .Version }}{{ end }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Performance improvements'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 'Refactors'
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999

# Homebrew tap: pushes a cask to github.com/j3ssie/homebrew-tap on every
# release, so `brew install j3ssie/tap/metabigor` tracks the newest version.
# GITHUB_TOKEN needs write access to the tap repo as well as to this one.
#
# Casks rather than the older `brews` formulas: goreleaser deprecated `brews`,
# and Homebrew now expects prebuilt binaries to ship as casks. Casks are macOS
# only — Linux users install via `npm install -g @j3ssie/metabigor` or the
# release archives.
homebrew_casks:
  - name: metabigor
    binaries:
      - metabigor
    repository:
      owner: j3ssie
      name: homebrew-tap
      branch: main
    homepage: "https://github.com/j3ssie/metabigor"
    description: "OSINT power without API key hassle"
    license: "MIT"
    commit_author:
      name: j3ssie
      email: j3ssiejjj@gmail.com
    hooks:
      post:
        # The release binaries are unsigned and unnotarized, so macOS quarantines
        # anything downloaded by brew and the first run dies with "cannot be
        # opened because the developer cannot be verified". Strip the flag at
        # install time.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/metabigor"]
          end

release:
  github:
    owner: j3ssie
    name: metabigor
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## metabigor {{ .Version }}

    **Full Changelog**: https://github.com/j3ssie/metabigor/compare/{{ .PreviousTag }}...{{ .Tag }}
  footer: |
    ## Installation

    ### Binary

    Download the pre-compiled binary for your platform from the assets below.

    **Note:** Binaries are compressed with UPX for reduced size.

    ### Go Install

    ```bash
    go install github.com/j3ssie/metabigor/cmd/metabigor@{{ .Tag }}
    ```

    ### Docker

    ```bash
    docker pull ghcr.io/j3ssie/metabigor:{{ .Tag }}
    ```

    ---

    **Thanks to all contributors!** 🎉
